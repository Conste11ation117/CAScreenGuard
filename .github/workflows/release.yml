# 打一个 v* 标签推上来，GitHub 就会自动：
#   1. 在标签指向的那个提交上现打一份「全部文件」的 zip
#   2. 从 CHANGELOG.md 里摘出这一版的说明当正文
#   3. 建 Release 并把 zip 挂上去
# zip 是现打的，所以不会出现「附件还是上一版」这种事。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打两个包：All 与 Setup-windows-x86
        run: |
          set -e
          # All：整份工程（源码、安装器、文档、截图）—— 与本地 CAScreenGuard-All\ 一致
          FILES=".gitattributes .gitignore AGENTS.md bridge/README.md bridge/cascreenguard-status.ps1 bridge/cascreenguard-watch.ps1 bridge/watch.json build-setup.ps1 CAScreenGuard-demo.ps1 CAScreenGuard-Setup.exe CAScreenGuard.ico CAScreenGuard.ps1 CAScreenGuard-wordmark.png CHANGELOG.md CHANGELOG.zh-CN.md Installer.cs LICENSE make-icon.ps1 make-wordmark.ps1 README.md README.zh-CN.md ScreenLockEarly.cs ScreenLockNative.cs SECURITY.md docs/rebuild-dialog.en.png docs/rebuild-dialog.zh-CN.png docs/lock-screen.en.jpg docs/lock-screen.zh-CN.jpg"
          # 清单是手写的，很容易漏：漏了就在这里失败，别偷偷少发东西
          # 注意：.github/ 下的东西本来就不进包，要先按 $f 判断跳过；
          # 之前把这一支写在 case "$FILES" 里，匹配对象错了，永远不成立 → 每次发版必失败
          for f in $(git ls-files); do
            case "$f" in
              .github/*) continue ;;
            esac
            case " $FILES " in
              *" $f "*) ;;
              *) echo "ERROR: $f 不在打包清单里"; exit 1 ;;
            esac
          done
          rm -f CAScreenGuard-All.zip CAScreenGuard-Setup-windows-x86.zip
          # 两个包都套一层与包同名的文件夹 —— 与本地那两个 zip 的结构保持一致
          rm -rf pkg
          mkdir -p pkg/CAScreenGuard-All pkg/CAScreenGuard-Setup-windows-x86
          # All：整份工程
          for f in $FILES; do
            mkdir -p "pkg/CAScreenGuard-All/$(dirname "$f")"
            cp "$f" "pkg/CAScreenGuard-All/$f"
          done
          # Setup-windows-x86：给"只想装一下"的人（LICENSE 必须一起发：MIT 的通知义务）
          cp CAScreenGuard-Setup.exe CAScreenGuard.ico LICENSE README.md README.zh-CN.md pkg/CAScreenGuard-Setup-windows-x86/
          (cd pkg && zip -r ../CAScreenGuard-All.zip CAScreenGuard-All && zip -r ../CAScreenGuard-Setup-windows-x86.zip CAScreenGuard-Setup-windows-x86)
          unzip -l CAScreenGuard-All.zip
          unzip -l CAScreenGuard-Setup-windows-x86.zip

      - name: 用整份 CHANGELOG 当 Release 正文
        run: |
          set -e
          # 与 v1.0.0 那份手改的正文保持同一格式：第一行 "# Changelog-EN"，后面接整份英文变更记录。
          # tail -n +2 丢掉文件自己的 H1（连同 BOM）。
          { printf '# Changelog-EN\n\n'; tail -n +2 CHANGELOG.md; } > release-notes.md
          wc -l release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 代号写在 CHANGELOG 的版本标题里（例如 "## [2.0.0] — 2026-10-16 Eclipse"）：
          # 有代号就用 "<tag> <代号>"，没有就只写 tag —— 现在只有大版本才给代号
          VER="${GITHUB_REF_NAME#v}"
          CODE=$(grep -m1 "^## \[$VER\]" CHANGELOG.md | sed "s/^## \[$VER\][^0-9]*[0-9][0-9]*-[0-9][0-9]*-[0-9][0-9]//" | tr -d "\r" | sed "s/^[[:space:]]*//;s/[[:space:]]*$//")
          TITLE="$GITHUB_REF_NAME"
          if [ -n "$CODE" ]; then TITLE="$GITHUB_REF_NAME $CODE"; fi
          echo "title = [$TITLE]"
          # 重推同一个标签（比如重写了历史）时，直接在原来那份 Release 上更新，
          # 别再 create 一次 —— 否则 gh 会报 "already exists"，Actions 上就是个红叉。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # --draft=false：万一远端已经有一份同名草稿（手工建的），也一并发布出来
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file release-notes.md --draft=false
            gh release upload "$GITHUB_REF_NAME" CAScreenGuard-All.zip CAScreenGuard-Setup-windows-x86.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              CAScreenGuard-All.zip \
              CAScreenGuard-Setup-windows-x86.zip \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
