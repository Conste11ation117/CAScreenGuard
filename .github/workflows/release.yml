# 打一个 v* 标签推上来，GitHub 就会自动：
#   1. 在标签指向的那个提交上现打一份「全部文件」的 zip
#   2. 从 CHANGELOG.md 里摘出这一版的说明当正文
#   3. 建 Release 并把 zip 挂上去
# zip 是现打的，所以不会出现「附件还是上一版」这种事。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip from this tag
        run: |
          set -e
          FILES=".gitattributes .gitignore build-setup.ps1 CAScreenGuard-demo.ps1 CAScreenGuard-Setup.exe CAScreenGuard.ico CAScreenGuard.ps1 CHANGELOG.md CHANGELOG.zh-CN.md Installer.cs LICENSE make-icon.ps1 README.md README.zh-CN.md ScreenLockEarly.cs ScreenLockNative.cs SECURITY.md docs/rebuild-dialog.en.png docs/rebuild-dialog.zh-CN.png"
          # 清单是手写的，很容易漏：漏了就在这里失败，别偷偷少发东西
          for f in $(git ls-files); do
            case " $FILES " in
              *" $f "*) ;;
              .github/*) ;;
              *) echo "ERROR: $f 不在打包清单里"; exit 1 ;;
            esac
          done
          zip -r "CAScreenGuard-${GITHUB_REF_NAME}-all.zip" $FILES
          unzip -l "CAScreenGuard-${GITHUB_REF_NAME}-all.zip"

      - name: 用整份 CHANGELOG 当 Release 正文
        run: |
          set -e
          # 与 v1.0.0 那份手改的正文保持同一格式：第一行 "# Changelog-EN"，后面接整份英文变更记录。
          # tail -n +2 丢掉文件自己的 H1（连同 BOM）。
          { printf '# Changelog-EN\n\n'; tail -n +2 CHANGELOG.md; } > release-notes.md
          wc -l release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE="$GITHUB_REF_NAME Navigator"        # 与 v1.0.0 的 "v1.0.0 Navigator" 保持同一命名
          # 重推同一个标签（比如重写了历史）时，直接在原来那份 Release 上更新，
          # 别再 create 一次 —— 否则 gh 会报 "already exists"，Actions 上就是个红叉。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" CAScreenGuard-*-all.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              CAScreenGuard-*-all.zip \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
